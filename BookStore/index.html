<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Bookstore</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Community Bookstore</h1>
    </header>

    <main>
      <div id="result-card"></div>


      <label for="name">Enter Your Name : </label>
      <input type="text" placeholder="ex: omar altoom" id="name" /><br /><br />

      <label for="membership">Enter membership type (student / regular):</label>
      <input type="text" placeholder="ex:student" id="membership" /><br /><br />

      <label for="prefer">Do you prefer fiction or non-fiction?</label>
      <input type="text" placeholder="ex: fiction" id="prefer" /><br /><br />

      <label for="book"> Enter the book title you want to borrow: </label>
      <input type="text" placeholder="ex: uml master" id="book" /><br /><br />

      <button id="btn">Reserve Books</button>
    </main>

    <script src="EX3.js"></script>
  </body>
</html>
