<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Use a Test Score array</h1>
    <label for="name">name : </label>
    <input type="text" id="nameInput" />
    <br />
    <br />
    <label for="score">Score : </label>
    <input type="text" id="scoreInput" />
    <br />
    <br />
    <button id="addBtn" style="margin-right: 15px">Add to Array</button>
    <button id="displayResultBtn" style="margin-right: 15px">
      Display Result
    </button>
    <button id="displayScoresBtn" style="margin-right: 15px">
      Display Scores
    </button>

    <h1>Result</h1>
    <div id="result"></div>

    <h1>Scores</h1>
    <table id="table">
      <tr>
        <th>Name</th>
        <th>Score</th>
      </tr>
    </table>
    <script src="script.js"></script>
  </body>
</html>
